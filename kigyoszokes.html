<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Kígyószökés</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120b06; --panel:#1c1209; --panel2:#2b1a0c; --line:#6b4a1d;
  --gold:#d9a441; --gold2:#f4cf6a; --cream:#f3e6c4; --muted:#a88e5f;
  --danger:#ff4d3a; --ok:#9bd66a;
  --serif:'Cinzel','Trajan Pro',Georgia,serif;
  --sans:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--cream);font-family:var(--sans);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{display:flex;flex-direction:column;height:100%}

/* ---------- top bar ---------- */
#bar{display:flex;align-items:center;flex-wrap:wrap;gap:10px 22px;padding:8px 14px;
  background:linear-gradient(#26170b,#1a1008);border-bottom:2px solid var(--line)}
.title{font-family:var(--serif);font-weight:900;font-size:18px;color:var(--gold2);letter-spacing:.04em;white-space:nowrap}
.lvl{display:flex;align-items:center;gap:10px}
.badge{width:46px;height:46px;display:grid;place-items:center;font-family:var(--serif);font-weight:900;font-size:30px;
  color:var(--gold2);background:var(--panel2);border:2px solid var(--gold);box-shadow:inset 0 0 0 3px var(--panel),0 0 14px rgba(217,164,65,.25)}
.lvlinfo{display:flex;flex-direction:column;line-height:1.2}
.lvlinfo b{font-family:var(--serif);font-size:14px;color:var(--cream)}
.lvlinfo span{font-size:12px;color:var(--muted)}
#lives{font-size:26px;letter-spacing:3px;color:var(--danger);line-height:1;text-shadow:0 0 10px rgba(255,77,58,.35)}
#lives .off{color:#4a3520;text-shadow:none}
#lives.hit{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.stat{display:flex;flex-direction:column;line-height:1.15;min-width:64px}
.stat small{font-size:11px;color:var(--muted)}
.stat b{font-family:var(--serif);font-size:18px;color:var(--cream);font-variant-numeric:tabular-nums}
.spacer{flex:1}
.btn{font-family:var(--serif);font-weight:700;font-size:13px;color:var(--gold2);background:var(--panel2);
  border:1px solid var(--gold);padding:8px 14px;cursor:pointer;letter-spacing:.03em}
.btn:hover{background:#3a2410}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.btn.primary{background:linear-gradient(#e2b04f,#b9822a);color:#1a0f06;border-color:#f4cf6a}
.btn.primary:hover{background:linear-gradient(#f0c15f,#c98f31)}
.btn:disabled{opacity:.45;cursor:not-allowed}
#strip{display:flex;gap:2px;padding:4px 14px;background:#150d07;border-bottom:1px solid #3a2810;overflow-x:auto;scrollbar-width:none}
#strip span{flex:0 0 auto;min-width:20px;text-align:center;font-family:var(--serif);font-weight:700;font-size:12px;
  padding:2px 3px;color:#6e5532;border:1px solid transparent}
#strip span.done{color:#1a0f06;background:var(--gold)}
#strip span.cur{color:var(--gold2);border-color:var(--gold2);background:var(--panel2)}

/* ---------- stage ---------- */
#stage{position:relative;flex:1;min-height:0;background:radial-gradient(ellipse at center,#1b1108 0%,#0d0704 100%)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#cv.over{cursor:pointer}
#cv.drag{cursor:grabbing}
#hint{position:absolute;left:12px;bottom:8px;font-size:12px;color:#7f6740;pointer-events:none}
#pauseNote{position:absolute;top:10px;left:50%;transform:translateX(-50%);padding:6px 14px;font-size:13px;color:#1a0f06;
  background:var(--gold);font-family:var(--serif);font-weight:700;display:none;pointer-events:none}
#zoomBtns{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
#zoomBtns .btn{width:38px;height:38px;padding:0;font-size:18px;font-family:var(--sans)}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;
  background:rgba(8,5,2,.86);z-index:10;overflow:auto}
#modal.open{display:flex}
.card{width:100%;max-width:480px;max-height:100%;overflow:auto;padding:26px 28px;
  background:linear-gradient(#2a190c,#1a1008);border:2px solid var(--gold);
  box-shadow:inset 0 0 0 4px #1a1008,inset 0 0 0 5px var(--line),0 12px 50px rgba(0,0,0,.7)}
.card h1,.card h2{font-family:var(--serif);color:var(--gold2);margin:0 0 12px;font-weight:900;letter-spacing:.03em}
.card h1{font-size:30px}.card h2{font-size:22px}
.card p{margin:0 0 12px;line-height:1.5;font-size:15px}
.card ul{margin:0 0 14px;padding-left:20px;line-height:1.5;font-size:14px;color:#d9c9a0}
.card label{display:block;margin:10px 0 4px;font-size:13px;color:var(--muted)}
.card input{width:100%;padding:10px 12px;font-size:18px;color:var(--cream);background:#120b06;border:1px solid var(--gold);
  -webkit-user-select:text;user-select:text}
.card input.code{font-family:var(--serif);font-size:24px;letter-spacing:.12em;text-align:center}
.row{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.row .btn{flex:1;padding:11px 14px;font-size:14px}
.stats{display:flex;gap:26px;margin:0 0 14px}
.stats .stat b{font-size:22px}
.task{margin:8px 0 14px;padding:12px 14px;border:1px solid var(--line);background:#150d07}
.task .name{font-family:var(--serif);font-weight:900;font-size:26px;color:var(--gold2);word-break:break-word}
.task small{color:var(--muted);font-size:12px}
.msg{min-height:20px;margin-top:8px;font-size:14px}
.msg.err{color:var(--danger)}.msg.ok{color:var(--ok)}.msg.wait{color:var(--muted)}
.shake{animation:shake .4s}
table.res{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:6px}
table.res th,table.res td{padding:3px 6px;text-align:right;border-bottom:1px solid #3a2810}
table.res th:first-child,table.res td:first-child{text-align:left;font-family:var(--serif);font-weight:700;color:var(--gold2)}
table.res th{color:var(--muted);font-weight:400}
.resbox{max-height:210px;overflow:auto;margin-bottom:10px;border:1px solid #3a2810}
@media (max-width:640px){
  #bar{gap:8px 14px;padding:6px 10px}.title{display:none}
  .badge{width:40px;height:40px;font-size:25px}#lives{font-size:22px}
  .stat b{font-size:15px}.stat{min-width:0}
  .card{padding:20px 18px}.card h1{font-size:25px}
  #hint{display:none}
}
@media (prefers-reduced-motion:reduce){#lives.hit,.shake{animation:none}}
</style>
</head>
<body>
<div id="app">
  <header id="bar">
    <div class="title">Kígyószökés</div>
    <div class="lvl">
      <div class="badge" id="badge">A</div>
      <div class="lvlinfo"><b id="lvlTxt">1. játék / 26</b><span id="sizeTxt">10 × 10</span></div>
    </div>
    <div id="lives" title="Életek"></div>
    <div class="stat"><small>Kígyók</small><b id="leftTxt">0</b></div>
    <div class="stat"><small>Hibák</small><b id="errTxt">0</b></div>
    <div class="stat"><small>Játékidő</small><b id="timeTxt">00:00</b></div>
    <div class="stat"><small>Összesen</small><b id="totalTxt">00:00</b></div>
    <div class="spacer"></div>

  <main id="stage">
    <canvas id="cv"></canvas>

    <div id="zoomBtns">
      <button class="btn" id="zin" aria-label="Nagyítás">+</button>

    </div>
  </main>
</div>
<div id="modal"><div class="card" id="card"></div></div>

<script>
(function () {
'use strict';

/* =====================================================================
   BEÁLLÍTÁSOK / SETTINGS  (the only part you normally need to touch)
   ===================================================================== */
const SHEET_ID  = '11a65OeIyUfd1fOmFXEvkEDO9q7oKc2Va16NdWN_-Htg';
const SHEET_CSV = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:csv';

/* Google Form results. Fill in after you have created the form:
   action = the form's ".../formResponse" URL, the others = the "entry.123456" field ids.
   Leave action empty to switch result sending off. */
const FORM = {
  action:   '',   // e.g. 'https://docs.google.com/forms/d/e/1FAIpQLS.../formResponse'
  name:     '',   // e.g. 'entry.111111111'   (Név)
  cls:      '',   //      'entry.222222222'   (Osztály)
  status:   '',   //      'entry.333333333'   (Állapot: folyamatban / befejezve)
  level:    '',   //      'entry.444444444'   (utolsó teljesített játék betűje)
  time:     '',   //      'entry.555555555'   (összes játékidő, mm:ss)
  mistakes: '',   //      'entry.666666666'   (összes hiba)
  details:  ''    //      'entry.777777777'   (játékonkénti idő és hiba)
};

const LIVES = 3;                 // lives per game
const LEVELS = 26;               // A-Z
const FULL_AT = 10;              // the 10th game (J) already has the maximum grid
const SNAKE_SPEED = 55;          // cells / second
const LONG_PRESS_MS = 380;       // hold time that shows the route
const MOVE_SLOP = 9;             // px of movement that turns a press into a drag
const WRONG_CODE_LOCK_MS = 2000; // pause after a wrong code
const PALETTE = ['#f2c14e','#f08a4b','#d98cbf','#7cc7f0','#5fc9a8','#b2d95a','#b9a2ee','#f4e6bd','#5b8fe6','#f0b69c'];
const DEMO = /[?&]demo\b/.test(location.search) &&
             (location.protocol === 'file:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)); // ?demo -> sample data, local testing only

/* ===== BOARD GENERATOR (pure functions) ===== */
const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];

function makeRng(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/* Random, organic blob covering ~60-75 % of the N x N square (4-connected). */
function makeBlob(N, rng) {
  const target = N * N * (0.60 + 0.15 * rng());
  const H = [];
  for (let k = 2; k <= 8; k++) {
    H.push({ k: k, a: (0.34 / Math.pow(k - 1, 0.85)) * rng(), p: rng() * Math.PI * 2 });
  }
  const sx = 0.82 + 0.36 * rng(), sy = 0.82 + 0.36 * rng();
  const rot = rng() * Math.PI, cr = Math.cos(rot), sr = Math.sin(rot);
  const ox = (rng() - 0.5) * 0.12, oy = (rng() - 0.5) * 0.12;
  const half = N / 2;
  function radius(th) {
    let r = 1;
    for (let i = 0; i < H.length; i++) r += H[i].a * Math.cos(H[i].k * th + H[i].p);
    return r < 0.35 ? 0.35 : r;
  }
  function inside(x, y, s) {
    const u = (x + 0.5) / half - 1 - ox, v = (y + 0.5) / half - 1 - oy;
    const ur = (u * cr + v * sr) / sx, vr = (-u * sr + v * cr) / sy;
    return Math.hypot(ur, vr) <= s * radius(Math.atan2(vr, ur));
  }
  function count(s) {
    let c = 0;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (inside(x, y, s)) c++;
    return c;
  }
  let lo = 0.15, hi = 2.6;
  for (let it = 0; it < 28; it++) {
    const mid = (lo + hi) / 2;
    if (count(mid) < target) lo = mid; else hi = mid;
  }
  const mask = new Uint8Array(N * N);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (inside(x, y, hi)) mask[y * N + x] = 1;
  return largestComponent(N, mask);
}

function largestComponent(N, mask) {
  const n = N * N, lab = new Int32Array(n).fill(-1);
  let best = -1, bestSize = 0, id = 0;
  const stack = [];
  for (let s = 0; s < n; s++) {
    if (!mask[s] || lab[s] >= 0) continue;
    let size = 0;
    stack.length = 0; stack.push(s); lab[s] = id;
    while (stack.length) {
      const c = stack.pop(); size++;
      const x = c % N, y = (c / N) | 0;
      for (let d = 0; d < 4; d++) {
        const nx = x + DIRS[d][0], ny = y + DIRS[d][1];
        if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
        const ni = ny * N + nx;
        if (mask[ni] && lab[ni] < 0) { lab[ni] = id; stack.push(ni); }
      }
    }
    if (size > bestSize) { bestSize = size; best = id; }
    id++;
  }
  const out = new Uint8Array(n);
  for (let i = 0; i < n; i++) if (lab[i] === best) out[i] = 1;
  return out;
}

/* distance (in cells) from the blob edge; edge cells = 1 */
function computeDepth(N, blob) {
  const n = N * N, depth = new Int32Array(n), q = [];
  for (let i = 0; i < n; i++) {
    if (!blob[i]) continue;
    const x = i % N, y = (i / N) | 0;
    let edge = false;
    for (let d = 0; d < 4; d++) {
      const nx = x + DIRS[d][0], ny = y + DIRS[d][1];
      if (nx < 0 || ny < 0 || nx >= N || ny >= N || !blob[ny * N + nx]) { edge = true; break; }
    }
    if (edge) { depth[i] = 1; q.push(i); }
  }
  for (let h = 0; h < q.length; h++) {
    const c = q[h], x = c % N, y = (c / N) | 0;
    for (let d = 0; d < 4; d++) {
      const nx = x + DIRS[d][0], ny = y + DIRS[d][1];
      if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
      const ni = ny * N + nx;
      if (blob[ni] && !depth[ni]) { depth[ni] = depth[c] + 1; q.push(ni); }
    }
  }
  return depth;
}

/* Straight ray from (x,y) in direction (dx,dy) to the grid edge.
   blocked -> k = free cells before the blocker, blocker = snake id.
   free    -> r = number of in-grid cells ahead. */
function rayInfo(owner, N, x, y, dx, dy) {
  let cx = x + dx, cy = y + dy, r = 0;
  while (cx >= 0 && cy >= 0 && cx < N && cy < N) {
    const o = owner[cy * N + cx];
    if (o >= 0) return { blocked: true, k: r, blocker: o, bx: cx, by: cy, r: r };
    r++; cx += dx; cy += dy;
  }
  return { blocked: false, k: r, blocker: -1, bx: -1, by: -1, r: r };
}

function pickW(weights, rng) {
  let s = 0;
  for (let i = 0; i < weights.length; i++) s += weights[i];
  let r = rng() * s;
  for (let i = 0; i < weights.length; i++) { r -= weights[i]; if (r <= 0) return i; }
  return weights.length - 1;
}

/* ---- Step 1: tile the whole blob with random winding paths (direction-free) ---- */
function tileBlob(N, blob, rng) {
  const n = N * N;
  const free = new Uint8Array(blob);
  const lk0 = new Int32Array(n).fill(-1), lk1 = new Int32Array(n).fill(-1);
  const freeCells = [], pos = new Int32Array(n).fill(-1);
  for (let i = 0; i < n; i++) if (free[i]) { pos[i] = freeCells.length; freeCells.push(i); }
  function take(i) {
    free[i] = 0;
    const p = pos[i], last = freeCells.pop();
    if (last !== i) { freeCells[p] = last; pos[last] = p; }
    pos[i] = -1;
  }
  function link(a, b) {
    if (lk0[a] < 0) lk0[a] = b; else lk1[a] = b;
    if (lk0[b] < 0) lk0[b] = a; else lk1[b] = a;
  }
  function freeDeg(i) {
    const x = i % N, y = (i / N) | 0;
    let c = 0;
    for (let d = 0; d < 4; d++) {
      const nx = x + DIRS[d][0], ny = y + DIRS[d][1];
      if (nx >= 0 && ny >= 0 && nx < N && ny < N && free[ny * N + nx]) c++;
    }
    return c;
  }
  const meanExtra = 2.4 + N / 18, Lmax = Math.round(6 + N * 0.55);
  while (freeCells.length) {
    // start at a "dead-end-like" cell: fewest free neighbours among a few samples
    let seed = -1, bd = 9;
    for (let k = 0; k < 8; k++) {
      const c = freeCells[(rng() * freeCells.length) | 0];
      const dg = freeDeg(c);
      if (dg < bd) { bd = dg; seed = c; }
    }
    take(seed);
    let len = 2 + Math.floor(-Math.log(1 - rng()) * meanExtra);
    if (len > Lmax) len = Lmax;
    let cur = seed, pdx = 0, pdy = 0, cnt = 1;
    while (cnt < len) {
      const cx = cur % N, cy = (cur / N) | 0;
      const cand = [], w = [];
      for (let d = 0; d < 4; d++) {
        const nx = cx + DIRS[d][0], ny = cy + DIRS[d][1];
        if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
        const ni = ny * N + nx;
        if (!free[ni]) continue;
        cand.push(ni);
        w.push(1 + (3 - freeDeg(ni)) * 1.4 + (DIRS[d][0] === pdx && DIRS[d][1] === pdy ? 0.4 : 0));
      }
      if (!cand.length) break;
      const nx = cand[pickW(w, rng)];
      take(nx); link(cur, nx);
      pdx = (nx % N) - cx; pdy = ((nx / N) | 0) - cy;
      cur = nx; cnt++;
    }
  }
  // merge lone cells into a neighbouring path end where possible
  for (let i = 0; i < n; i++) {
    if (!blob[i] || lk0[i] >= 0) continue;
    const x = i % N, y = (i / N) | 0, ends = [];
    for (let d = 0; d < 4; d++) {
      const nx = x + DIRS[d][0], ny = y + DIRS[d][1];
      if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue;
      const ni = ny * N + nx;
      if (blob[ni] && lk1[ni] < 0) ends.push(ni);
    }
    if (ends.length) link(i, ends[(rng() * ends.length) | 0]);
  }
  return { lk0: lk0, lk1: lk1 };
}

/* ---- Step 2: peel the board from the outside in. Every piece removed is, at that
   moment, a snake with a free ray -> the removal order is a valid solution.
   When no whole path end has a free ray, a path is cut at an extreme cell. ---- */
function peelBoard(N, blob, tiling, rng) {
  const n = N * N;
  const lk0 = tiling.lk0, lk1 = tiling.lk1;
  const inR = new Uint8Array(blob);
  let remaining = 0;
  for (let i = 0; i < n; i++) if (inR[i]) remaining++;
  const rmin = new Int32Array(N).fill(-1), rmax = new Int32Array(N).fill(-1);
  const cmin = new Int32Array(N).fill(-1), cmax = new Int32Array(N).fill(-1);
  function calcRow(y) {
    let a = -1, b = -1;
    for (let x = 0; x < N; x++) if (inR[y * N + x]) { if (a < 0) a = y * N + x; b = y * N + x; }
    rmin[y] = a; rmax[y] = b;
  }
  function calcCol(x) {
    let a = -1, b = -1;
    for (let y = 0; y < N; y++) if (inR[y * N + x]) { if (a < 0) a = y * N + x; b = y * N + x; }
    cmin[x] = a; cmax[x] = b;
  }
  for (let i = 0; i < N; i++) { calcRow(i); calcCol(i); }
  function unlink(a, b) { // remove b from a's links
    if (lk0[a] === b) { lk0[a] = lk1[a]; lk1[a] = -1; } else if (lk1[a] === b) lk1[a] = -1;
  }
  const pieces = [];
  let cuts = 0;
  while (remaining > 0) {
    const endOpts = [], cutOpts = [];
    function consider(c, d) {
      if (c < 0) return;
      const x = c % N, y = (c / N) | 0;
      if (lk0[c] < 0) { endOpts.push({ c: c, d: d, m: -1 }); return; }
      const mx = x - DIRS[d][0], my = y - DIRS[d][1];
      if (mx < 0 || my < 0 || mx >= N || my >= N) return;
      const m = my * N + mx;
      if (lk0[c] === m || lk1[c] === m) {
        if (lk1[c] < 0) endOpts.push({ c: c, d: d, m: m }); else cutOpts.push({ c: c, d: d, m: m });
      }
    }
    for (let i = 0; i < N; i++) {
      consider(rmax[i], 0); consider(rmin[i], 2);
      consider(cmax[i], 1); consider(cmin[i], 3);
    }
    let opt;
    if (endOpts.length && (rng() > 0.04 || !cutOpts.length)) opt = endOpts[(rng() * endOpts.length) | 0];
    else { opt = cutOpts[(rng() * cutOpts.length) | 0]; cuts++; }
    // collect the piece: head c, then along the neck side
    const cells = [opt.c];
    if (opt.m >= 0) {
      let prev = opt.c, cur = opt.m;
      for (;;) {
        cells.push(cur);
        const nx = lk0[cur] === prev ? lk1[cur] : lk0[cur];
        if (nx < 0) break;
        prev = cur; cur = nx;
      }
      if (lk1[opt.c] >= 0) { // cut: the other side stays
        const q = lk0[opt.c] === opt.m ? lk1[opt.c] : lk0[opt.c];
        unlink(q, opt.c);
      }
    }
    const rows = new Set(), cols = new Set();
    for (let i = 0; i < cells.length; i++) {
      inR[cells[i]] = 0; remaining--;
      rows.add((cells[i] / N) | 0); cols.add(cells[i] % N);
    }
    rows.forEach(calcRow); cols.forEach(calcCol);
    cells.reverse(); // tail -> head
    pieces.push({ cells: cells, dx: DIRS[opt.d][0], dy: DIRS[opt.d][1], len: cells.length });
  }
  return { pieces: pieces, cuts: cuts };
}

function fillSnakes(N, blob, rng) {
  const tiling = tileBlob(N, blob, rng);
  const pr = peelBoard(N, blob, tiling, rng);
  const owner = new Int32Array(N * N).fill(-1);
  const snakes = pr.pieces;
  for (let s = 0; s < snakes.length; s++) {
    snakes[s].id = s;
    for (let i = 0; i < snakes[s].len; i++) owner[snakes[s].cells[i]] = s;
  }
  return { owner: owner, snakes: snakes, blob: new Uint8Array(blob), leftover: 0, cuts: pr.cuts };
}

/* the pieces are stored in removal order: removing them one by one must always work */
function verifySolvable(N, snakes, ownerIn) {
  const owner = new Int32Array(ownerIn);
  for (let s = 0; s < snakes.length; s++) {
    const sn = snakes[s], h = sn.cells[sn.len - 1];
    if (rayInfo(owner, N, h % N, (h / N) | 0, sn.dx, sn.dy).blocked) return false;
    for (let i = 0; i < sn.len; i++) owner[sn.cells[i]] = -1;
  }
  return true;
}

/* one colour per snake; neighbouring snakes get different colours where possible,
   colours form loose regional patches */
function assignColors(N, res, rng, nColors) {
  const snakes = res.snakes, owner = res.owner;
  const adj = snakes.map(() => []);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const a = owner[y * N + x];
    if (a < 0) continue;
    if (x + 1 < N) { const b = owner[y * N + x + 1]; if (b >= 0 && b !== a) { adj[a].push(b); adj[b].push(a); } }
    if (y + 1 < N) { const b = owner[(y + 1) * N + x]; if (b >= 0 && b !== a) { adj[a].push(b); adj[b].push(a); } }
  }
  const seeds = [], ns = 5 + Math.round(Math.sqrt(N));
  for (let i = 0; i < ns; i++) seeds.push({ x: rng() * N, y: rng() * N, c: (rng() * nColors) | 0 });
  const order = snakes.map((s, i) => i);
  for (let i = order.length - 1; i > 0; i--) { const j = (rng() * (i + 1)) | 0; const t = order[i]; order[i] = order[j]; order[j] = t; }
  const col = new Int16Array(snakes.length).fill(-1);
  for (let oi = 0; oi < order.length; oi++) {
    const s = snakes[order[oi]], h = s.cells[s.len - 1];
    const hx = h % N, hy = (h / N) | 0;
    let bd = 1e18, region = 0;
    for (let i = 0; i < seeds.length; i++) {
      const d = (seeds[i].x - hx) * (seeds[i].x - hx) + (seeds[i].y - hy) * (seeds[i].y - hy);
      if (d < bd) { bd = d; region = seeds[i].c; }
    }
    const start = rng() < 0.35 ? (rng() * nColors) | 0 : region;
    let bestC = start, bestConf = 1e9;
    for (let k = 0; k < nColors; k++) {
      const c = (start + k) % nColors;
      let conf = 0;
      const nb = adj[s.id];
      for (let j = 0; j < nb.length; j++) if (col[nb[j]] === c) conf++;
      if (conf < bestConf) { bestConf = conf; bestC = c; if (conf === 0) break; }
    }
    col[s.id] = bestC;
  }
  for (let i = 0; i < snakes.length; i++) snakes[i].ci = col[i];
}

function generateLevel(N, rng, nColors) {
  let res = null;
  for (let attempt = 0; attempt < 6; attempt++) {
    const blob = makeBlob(N, rng);
    res = fillSnakes(N, blob, rng);
    if (res.snakes.length && verifySolvable(N, res.snakes, res.owner)) break;
  }
  assignColors(N, res, rng, nColors);
  for (const s of res.snakes) {
    let x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1;
    s.xs = new Int16Array(s.len); s.ys = new Int16Array(s.len);
    for (let i = 0; i < s.len; i++) {
      const x = s.cells[i] % N, y = (s.cells[i] / N) | 0;
      s.xs[i] = x; s.ys[i] = y;
      if (x < x0) x0 = x; if (x > x1) x1 = x;
      if (y < y0) y0 = y; if (y > y1) y1 = y;
    }
    s.bx0 = x0; s.by0 = y0; s.bx1 = x1; s.by1 = y1;
    s.alive = true; s.busy = false;
  }
  return { N: N, owner: res.owner, snakes: res.snakes, blob: res.blob, leftover: res.leftover };
}

function sizeFor(i) {
  const a = Math.min(S.cfg.min, S.cfg.max), b = Math.max(S.cfg.min, S.cfg.max);
  return Math.max(5, Math.round(a + (b - a) * Math.min(i, FULL_AT - 1) / (FULL_AT - 1)));
}
function fmt(ms) {
  const t = Math.floor(ms / 1000), h = Math.floor(t / 3600), m = Math.floor((t % 3600) / 60), s = t % 60;
  const p = (v) => (v < 10 ? '0' : '') + v;
  return (h ? h + ':' : '') + p(m) + ':' + p(s);
}
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* =====================================================================
   GOOGLE SHEET
   ===================================================================== */
function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}
const num = (s) => { const v = Number(String(s == null ? '' : s).trim().replace(',', '.')); return isFinite(v) && String(s).trim() !== '' ? v : NaN; };

/* rows[0] = header row. Returns {min,max,tasks}. */
function parseSheetRows(all) {
  const rows = all.slice(1);
  let min = 10, max = 100;
  for (const r of rows) {
    const a = num(r[0]), b = num(r[1]);
    if (!isNaN(a) || !isNaN(b)) { if (!isNaN(a)) min = Math.round(a); if (!isNaN(b)) max = Math.round(b); break; }
  }
  const tasks = [];
  rows.forEach((r, i) => {
    const code = String(r[3] == null ? '' : r[3]).trim();
    if (code) tasks.push({ name: String(r[2] == null ? '' : r[2]).trim() || ('Feladat ' + (i + 1)), code: code });
  });
  if (!tasks.length) throw new Error('nincs kód a táblázat D oszlopában');
  return { min: min, max: max, tasks: tasks };
}

/* Way 1: <script> request (JSONP). It is not subject to CORS, so it also works from a local file. */
function loadViaScript() {
  return new Promise((resolve, reject) => {
    const cb = '__gviz' + Date.now();
    const s = document.createElement('script');
    const timer = setTimeout(() => { cleanup(); reject(new Error('időtúllépés')); }, 12000);
    function cleanup() { clearTimeout(timer); try { delete window[cb]; } catch (e) { window[cb] = undefined; } if (s.parentNode) s.parentNode.removeChild(s); }
    window[cb] = (data) => {
      cleanup();
      try {
        if (!data || data.status === 'error' || !data.table) throw new Error('a táblázat nem olvasható (megosztás?)');
        const labels = data.table.cols.map((c) => c.label || '');
        const cell = (c) => (c == null || c.v == null ? '' : String(c.v));
        const M = [];
        if (labels.some(Boolean)) M.push(labels);
        data.table.rows.forEach((r) => M.push((r.c || []).map(cell)));
        resolve(parseSheetRows(M));
      } catch (e) { reject(e); }
    };
    s.onerror = () => { cleanup(); reject(new Error('a kérés blokkolva')); };
    s.src = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/gviz/tq?tqx=out:json;responseHandler:' + cb + '&_=' + Date.now();
    document.head.appendChild(s);
  });
}
/* Way 2: fetch CSV (needs CORS to be allowed) */
async function loadViaFetch() {
  const res = await fetch(SHEET_CSV + '&_=' + Date.now(), { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const text = await res.text();
  if (/^\s*</.test(text)) throw new Error('a táblázat nem érhető el (megosztás?)');
  return parseSheetRows(parseCSV(text));
}
async function loadSheet() {
  if (DEMO) return { min: 10, max: 100, tasks: [{ name: 'T1', code: '4567' }, { name: 'T2', code: '7764' }, { name: 'T3', code: '9529' }] };
  try { return await loadViaScript(); }
  catch (e1) {
    try { return await loadViaFetch(); }
    catch (e2) { throw new Error(e1.message + '; ' + (e2.message || 'Failed to fetch')); }
  }
}
function normCode(s) { return String(s).trim().toLowerCase().replace(/\s+/g, '').replace(',', '.'); }
function nextTask() {
  if (!S.queue.length) {
    const idx = S.cfg.tasks.map((_, i) => i);
    for (let i = idx.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; const t = idx[i]; idx[i] = idx[j]; idx[j] = t; }
    if (idx.length > 1 && idx[0] === S.lastTask) { const t = idx[0]; idx[0] = idx[idx.length - 1]; idx[idx.length - 1] = t; }
    S.queue = idx;
  }
  S.lastTask = S.queue.shift();
  return S.cfg.tasks[S.lastTask];
}

/* =====================================================================
   GOOGLE FORM RESULTS

function sendResults(status) {
  if (!FORM.action) return;
  const p = new URLSearchParams();
  const put = (k, v) => { if (FORM[k]) p.append(FORM[k], v); };
  const done = S.results.length;
  put('name', S.player.name); put('cls', S.player.cls); put('status', status);
  put('level', done ? LETTERS[done - 1] : '-');
  put('time', fmt(S.totalMs)); put('mistakes', String(S.totalMistakes));
  put('details', S.results.map((r) => r.letter + ': ' + fmt(r.ms) + ' / ' + r.mistakes + ' hiba').join('; '));
  try { fetch(FORM.action, { method: 'POST', mode: 'no-cors', body: p }).catch(() => {}); } catch (e) { /* ignore */ }
}

/* =====================================================================
   LEVEL
   ===================================================================== */
function startLevel(i) {
  const N = sizeFor(i);
  const g = generateLevel(N, Math.random, PALETTE.length);
  const byColor = PALETTE.map(() => []);
  g.snakes.forEach((s) => byColor[s.ci].push(s));
  L = { N: N, owner: g.owner, snakes: g.snakes, blob: g.blob, byColor: byColor,
        remaining: g.snakes.length, lives: LIVES, mistakes: 0, ms: 0,
        done: false, dead: false, anims: [], hover: -1, preview: -1, ring: null, flash: null };
  fitView();
  updateHud(true);
  requestDraw();
}

function rayOf(s) { return rayInfo(L.owner, L.N, s.xs[s.len - 1], s.ys[s.len - 1], s.dx, s.dy); }

function buildPath(s, extra) {
  const M = s.len + extra, P = new Float32Array(M * 2);
  for (let i = 0; i < s.len; i++) { P[i * 2] = s.xs[i] + 0.5; P[i * 2 + 1] = s.ys[i] + 0.5; }
  const hx = s.xs[s.len - 1] + 0.5, hy = s.ys[s.len - 1] + 0.5;
  for (let k = 1; k <= extra; k++) { P[(s.len - 1 + k) * 2] = hx + s.dx * k; P[(s.len - 1 + k) * 2 + 1] = hy + s.dy * k; }
  return P;
}

function launch(s) {
  if (!L || !s.alive || s.busy || L.done || L.dead || modalOpen) return;
  const info = rayOf(s);
  s.busy = true;
  if (!info.blocked) {
    s.alive = false;
    for (let i = 0; i < s.len; i++) L.owner[s.ys[i] * L.N + s.xs[i]] = -1;
    L.remaining--;
    s.P = buildPath(s, info.r + s.len + 1);
    L.anims.push({ kind: 'out', s: s, t: 0, r: info.r });
    if (L.preview === s.id) L.preview = -1;
    updateHud();
    if (L.remaining === 0) levelComplete();
  } else {
    const limit = info.k + 0.2;
    s.P = buildPath(s, info.k + 3);
    L.anims.push({ kind: 'bounce', s: s, t: 0, limit: limit, phase: 'fwd', speed: limit / Math.max(0.14, limit / SNAKE_SPEED), bx: info.bx, by: info.by });
  }
  requestDraw();
}

function onHit(a, now) {
  L.lives--; L.mistakes++; S.totalMistakes++;
  L.ring = { x: a.bx, y: a.by, from: now, until: now + 650 };
  L.flash = { id: a.s.id, until: now + 550 };
  const el = $('lives'); el.classList.remove('hit'); void el.offsetWidth; el.classList.add('hit');
  updateHud();
  if (L.lives <= 0) {
    L.dead = true;
    setTimeout(waitAnimsThen.bind(null, showDeadModal), 450);
  }
}
function waitAnimsThen(fn) {
  if (L && L.anims.length) { setTimeout(waitAnimsThen.bind(null, fn), 120); return; }
  fn();
}

function levelComplete() {
  L.done = true;
  const last = S.level === LEVELS - 1;
  S.results.push({ letter: LETTERS[S.level], ms: L.ms, mistakes: L.mistakes, size: L.N });
  sendResults(last ? 'befejezve' : 'folyamatban');
  updateHud();
  setTimeout(waitAnimsThen.bind(null, () => (last ? showFinalModal() : showCompleteModal())), 350);
}

  openModal(
    '<h2>Mind a ' + LEVELS + ' játékot megoldottad, ' + esc(S.player.name) + '!</h2>' +
    '<div class="stats"><div class="stat"><small>Összes idő</small><b>' + fmt(S.totalMs) + '</b></div>' +
    '<div class="stat"><small>Összes hiba</small><b>' + S.totalMistakes + '</b></div></div>' +
    '<div class="resbox"><table class="res"><tr><th>Játék</th><th>Pálya</th><th>Idő</th><th>Hiba</th></tr>' + rows + '</table></div>' +
    '<div class="row"><button class="btn primary" id="againBtn">Új játék</button></div>'
  );
  $('againBtn').onclick = () => { L = null; showStart(); draw(performance.now()); };
}

function showResetConfirm() {
  if (modalOpen) return;
  openModal('<h2>Újrakezdés</h2><p>Biztosan újrakezded az egész játékot az A szinttől? Az eddigi eredményeid elvesznek.</p>' +
    '<div class="row"><button class="btn" id="noBtn">Mégse</button><button class="btn primary" id="yesBtn">Újrakezdés</button></div>');
  $('noBtn').onclick = closeModal;
  $('yesBtn').onclick = () => { closeModal(); L = null; S.results = []; S.level = 0; updateStripReset(); showStart(); requestDraw(); };
}
function updateStripReset() { for (const sp of strip.children) sp.className = ''; }

/* =====================================================================
   VIEW / RENDERING
   ===================================================================== */
const stage = $('stage'), canvas = $('cv'), ctx = canvas.getContext('2d');
let cw = 1, ch = 1, dpr = 1;
const view = { z: 10, ox: 0, oy: 0, fitZ: 10, fitted: true };

function computeFit() { view.fitZ = L ? Math.min(cw, ch) / (L.N + 1.5) : 10; }
function fitView() { computeFit(); view.z = view.fitZ; view.ox = (cw - (L ? L.N : 0) * view.z) / 2; view.oy = (ch - (L ? L.N : 0) * view.z) / 2; view.fitted = true; }
function clampView() {
  if (!L) return;
  const sz = L.N * view.z, m = 60;
  view.ox = Math.min(cw - m, Math.max(m - sz, view.ox));
  view.oy = Math.min(ch - m, Math.max(m - sz, view.oy));
}
function zoomAt(px, py, f) {
  const nz = Math.min(140, Math.max(view.fitZ * 0.5, view.z * f));
  f = nz / view.z;
  view.ox = px - (px - view.ox) * f; view.oy = py - (py - view.oy) * f; view.z = nz; view.fitted = false;
  clampView(); requestDraw();
}
function resize() {
  const r = stage.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cw = Math.max(1, r.width); ch = Math.max(1, r.height);
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  if (L) { const wasFit = view.fitted; computeFit(); if (wasFit) fitView(); else clampView(); }
  requestDraw();
}
window.addEventListener('resize', resize);

let raf = 0, lastFrame = 0;
function requestDraw() { if (!raf) raf = requestAnimationFrame(frame); }
function stepAnim(a, dt, now) {
  const s = a.s;
  if (a.kind === 'out') { a.t += SNAKE_SPEED * dt; return a.t < s.len + a.r; }
  if (a.phase === 'fwd') { a.t += a.speed * dt; if (a.t >= a.limit) { a.t = a.limit; a.phase = 'back'; onHit(a, now); } }
  else { a.t -= a.speed * dt; if (a.t <= 0) { s.busy = false; return false; } }
  return true;
}
function frame(now) {
  raf = 0;
  const dt = Math.min(0.05, (now - (lastFrame || now)) / 1000); lastFrame = now;
  let more = false;
  if (L) {
    for (let i = L.anims.length - 1; i >= 0; i--) if (!stepAnim(L.anims[i], dt, now)) L.anims.splice(i, 1);
    if (L.anims.length) more = true;
    if (L.ring) { if (now < L.ring.until) more = true; else L.ring = null; }
    if (L.flash) { if (now < L.flash.until) more = true; else L.flash = null; }
  }
  draw(now);
  if (more) raf = requestAnimationFrame(frame); else lastFrame = 0;
}

function addPoly(s) {
  ctx.moveTo(s.xs[0] + 0.5, s.ys[0] + 0.5);
  for (let i = 1; i < s.len; i++) ctx.lineTo(s.xs[i] + 0.5, s.ys[i] + 0.5);
  if (s.len === 1) ctx.lineTo(s.xs[0] + 0.501, s.ys[0] + 0.5);
}
function addArrow(hx, hy, dx, dy) {
  const px = -dy, py = dx;
  ctx.moveTo(hx + dx * 0.56, hy + dy * 0.56);
  ctx.lineTo(hx - dx * 0.04 + px * 0.42, hy - dy * 0.04 + py * 0.42);
  ctx.lineTo(hx - dx * 0.04 - px * 0.42, hy - dy * 0.04 - py * 0.42);
  ctx.closePath();
}
function lighten(hex, a) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const m = (v) => Math.round(v + (255 - v) * a);
  return 'rgb(' + m(r) + ',' + m(g) + ',' + m(b) + ')';
}
function strokeSnake(s, color, lw) {
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lw;
  ctx.beginPath(); addPoly(s); ctx.stroke();
  ctx.beginPath(); addArrow(s.xs[s.len - 1] + 0.5, s.ys[s.len - 1] + 0.5, s.dx, s.dy); ctx.fill();
}
function ptAt(P, M, i) {
  if (i <= 0) return [P[0], P[1]];
  if (i >= M - 1) return [P[(M - 1) * 2], P[(M - 1) * 2 + 1]];
  const k = Math.floor(i), f = i - k;
  return [P[k * 2] * (1 - f) + P[k * 2 + 2] * f, P[k * 2 + 1] * (1 - f) + P[k * 2 + 3] * f];
}
function drawAnim(a, now) {
  const s = a.s, P = s.P, M = P.length / 2, len = s.len;
  const i0 = a.t, i1 = a.t + len - 1;
  let alpha = 1;
  if (a.kind === 'out' && a.t > a.r) alpha = Math.max(0, 1 - (a.t - a.r) / len);
  const hot = a.kind === 'bounce' && a.phase === 'back';
  const col = hot ? '#ff4d3a' : PALETTE[s.ci];
  ctx.globalAlpha = alpha; ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 0.36;
  ctx.beginPath();
  const p0 = ptAt(P, M, i0); ctx.moveTo(p0[0], p0[1]);
  for (let k = Math.floor(i0) + 1; k < i1; k++) ctx.lineTo(P[k * 2], P[k * 2 + 1]);
  const p1 = ptAt(P, M, i1); ctx.lineTo(p1[0], p1[1]);
  if (len === 1) ctx.lineTo(p1[0] + 0.001, p1[1]);
  ctx.stroke();
  ctx.beginPath(); addArrow(p1[0], p1[1], s.dx, s.dy); ctx.fill();
  ctx.globalAlpha = 1;
}

function draw(now) {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, cw, ch);
  if (!L) return;
  const N = L.N, z = view.z;
  ctx.save();
  ctx.translate(view.ox, view.oy); ctx.scale(z, z);
  const x0 = Math.max(0, Math.floor(-view.ox / z)), y0 = Math.max(0, Math.floor(-view.oy / z));
  const x1 = Math.min(N - 1, Math.floor((cw - view.ox) / z)), y1 = Math.min(N - 1, Math.floor((ch - view.oy) / z));

  // active area (the blob)
  ctx.fillStyle = '#26170a'; ctx.beginPath();
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (L.blob[y * N + x]) ctx.rect(x - 0.015, y - 0.015, 1.03, 1.03);
  ctx.fill();
  if (z >= 7) {
    ctx.fillStyle = '#3f2a13'; ctx.beginPath();
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) if (L.blob[y * N + x]) ctx.rect(x + 0.44, y + 0.44, 0.12, 0.12);
    ctx.fill();
  }

  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 0.36;
  const flashId = (L.flash && now < L.flash.until) ? L.flash.id : -1;
  const special = (s) => s.id === L.hover || s.id === flashId;
  for (let ci = 0; ci < PALETTE.length; ci++) {
    const list = L.byColor[ci];
    ctx.strokeStyle = PALETTE[ci]; ctx.fillStyle = PALETTE[ci];
    ctx.beginPath(); let any = false;
    for (let k = 0; k < list.length; k++) {
      const s = list[k];
      if (!s.alive || s.busy || special(s)) continue;
      if (s.bx1 < x0 || s.bx0 > x1 || s.by1 < y0 || s.by0 > y1) continue;
      addPoly(s); any = true;
    }
    if (!any) continue;
    ctx.stroke();
    ctx.beginPath();
    for (let k = 0; k < list.length; k++) {
      const s = list[k];
      if (!s.alive || s.busy || special(s)) continue;
      if (s.bx1 < x0 || s.bx0 > x1 || s.by1 < y0 || s.by0 > y1) continue;
      addArrow(s.xs[s.len - 1] + 0.5, s.ys[s.len - 1] + 0.5, s.dx, s.dy);
    }
    ctx.fill();
  }

  // hovered snake: soft halo + lighter colour
  if (L.hover >= 0) {
    const s = L.snakes[L.hover];
    if (s && s.alive && !s.busy) {
      ctx.globalAlpha = 0.28; strokeSnake(s, '#ffffff', 0.78); ctx.globalAlpha = 1;
      strokeSnake(s, lighten(PALETTE[s.ci], 0.35), 0.42);
    }
  }
  if (flashId >= 0) {
    const s = L.snakes[flashId];
    if (s && s.alive && !s.busy) strokeSnake(s, '#ff4d3a', 0.42);
  }
  for (let i = 0; i < L.anims.length; i++) drawAnim(L.anims[i], now);

  // route preview
  if (L.preview >= 0) {
    const s = L.snakes[L.preview];
    if (s && s.alive && !s.busy) {
      const info = rayOf(s), col = info.blocked ? '#ff4d3a' : '#ffffff';
      const hx = s.xs[s.len - 1] + 0.5, hy = s.ys[s.len - 1] + 0.5;
      const dist = info.blocked ? info.k + 1 : info.r + 0.5;
      ctx.save();
      ctx.shadowColor = col; ctx.shadowBlur = 10;
      ctx.strokeStyle = col; ctx.lineWidth = 0.2; ctx.globalAlpha = 0.95;
      ctx.beginPath(); ctx.moveTo(hx + s.dx * 0.5, hy + s.dy * 0.5); ctx.lineTo(hx + s.dx * dist, hy + s.dy * dist); ctx.stroke();
      ctx.restore();
      if (info.blocked) {
        ctx.strokeStyle = '#ff4d3a'; ctx.lineWidth = 0.14;
        ctx.beginPath(); ctx.arc(info.bx + 0.5, info.by + 0.5, 0.62, 0, Math.PI * 2); ctx.stroke();
      }
    }
  }
  // collision ring
  if (L.ring && now < L.ring.until) {
    const t = (now - L.ring.from) / (L.ring.until - L.ring.from);
    ctx.globalAlpha = 1 - t; ctx.strokeStyle = '#ff4d3a'; ctx.lineWidth = 0.16;
    ctx.beginPath(); ctx.arc(L.ring.x + 0.5, L.ring.y + 0.5, 0.5 + t * 1.2, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

/* =====================================================================
   INPUT (mouse, touch, wheel)
   ===================================================================== */
const ptrs = new Map();
let g = null, pinch = null;
function local(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function snakeAt(px, py) {
  if (!L) return -1;
  const x = Math.floor((px - view.ox) / view.z), y = Math.floor((py - view.oy) / view.z);
  if (x < 0 || y < 0 || x >= L.N || y >= L.N) return -1;
  return L.owner[y * L.N + x];
}
function endGesture() { if (g && g.timer) clearTimeout(g.timer); g = null; canvas.classList.remove('drag'); }

canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('pointerdown', (e) => {
  if (!L || modalOpen) return;
  canvas.setPointerCapture(e.pointerId);
  const p = local(e);
  ptrs.set(e.pointerId, p);
  if (ptrs.size === 1) {
    const id = snakeAt(p.x, p.y);
    g = { sx: p.x, sy: p.y, lx: p.x, ly: p.y, id: id, moved: false, preview: false, timer: 0 };
    if (id >= 0 && L.snakes[id].alive && !L.snakes[id].busy) {
      g.timer = setTimeout(() => {
        if (g && !g.moved && !g.preview) { g.preview = true; L.preview = id; requestDraw(); }
      }, LONG_PRESS_MS);
    }
  } else if (ptrs.size === 2) {
    if (L) L.preview = -1;
    endGesture();
    const [a, b] = Array.from(ptrs.values());
    pinch = { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 };
    requestDraw();
  }
});
canvas.addEventListener('pointermove', (e) => {
  const p = local(e);
  if (!ptrs.has(e.pointerId)) {
    if (e.pointerType === 'mouse' && L && !modalOpen) {
      const id = snakeAt(p.x, p.y), ok = id >= 0 && L.snakes[id].alive && !L.snakes[id].busy;
      const h = ok ? id : -1;
      canvas.classList.toggle('over', ok);
      if (h !== L.hover) { L.hover = h; requestDraw(); }
    }
    return;
  }
  ptrs.set(e.pointerId, p);
  if (ptrs.size >= 2 && pinch) {
    const [a, b] = Array.from(ptrs.values());
    const d = Math.hypot(a.x - b.x, a.y - b.y) || 1, cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
    view.ox += cx - pinch.cx; view.oy += cy - pinch.cy;
    zoomAt(cx, cy, d / pinch.d);
    pinch.d = d; pinch.cx = cx; pinch.cy = cy;
    return;
  }
  if (!g) return;
  if (g.preview) return;                       // holding to inspect the route: do not pan
  if (!g.moved && Math.hypot(p.x - g.sx, p.y - g.sy) > MOVE_SLOP) {
    g.moved = true; if (g.timer) { clearTimeout(g.timer); g.timer = 0; }
    canvas.classList.add('drag');
  }
  if (g.moved) {
    view.ox += p.x - g.lx; view.oy += p.y - g.ly; view.fitted = false;
    clampView(); requestDraw();
  }
  g.lx = p.x; g.ly = p.y;
});
function pointerEnd(e, cancelled) {
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinch = null;
  if (!g) return;
  const wasPreview = g.preview, moved = g.moved, id = g.id;
  endGesture();
  if (wasPreview) { if (L) { L.preview = -1; requestDraw(); } return; }   // release after long press: no launch
  if (!cancelled && !moved && id >= 0 && L) launch(L.snakes[id]);
}
canvas.addEventListener('pointerup', (e) => pointerEnd(e, false));
canvas.addEventListener('pointercancel', (e) => pointerEnd(e, true));
canvas.addEventListener('pointerleave', (e) => {
  if (e.pointerType === 'mouse' && L && L.hover >= 0 && !ptrs.size) { L.hover = -1; canvas.classList.remove('over'); requestDraw(); }
});
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  if (!L || modalOpen) return;
  const p = local(e);
  let dy = e.deltaY; if (e.deltaMode === 1) dy *= 16; else if (e.deltaMode === 2) dy *= 400;
  zoomAt(p.x, p.y, Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.0016)));
}, { passive: false });

$('fitBtn').onclick = () => { if (L) { fitView(); requestDraw(); } };
$('zin').onclick = () => zoomAt(cw / 2, ch / 2, 1.3);
$('zout').onclick = () => zoomAt(cw / 2, ch / 2, 1 / 1.3);
$('resetBtn').onclick = showResetConfirm;

/* =====================================================================
   BOOT
   ===================================================================== */
function initSheet() {
  S.sheet = 'loading'; S.sheetErr = '';
  loadSheet().then((cfg) => { S.cfg = cfg; S.sheet = 'ok'; })
    .catch((err) => { S.sheet = 'error'; S.sheetErr = (err && err.message) || 'ismeretlen hiba'; })
    .then(() => { if (window.__refreshStart) window.__refreshStart(); });
}
if (DEMO) window.__dbg = { S: S, getL: () => L, launch: launch, rayOf: rayOf };
initSheet();
resize();
showStart();
})();
</script>
</body>
